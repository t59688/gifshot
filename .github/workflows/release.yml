name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Require committed dependency lock
        shell: pwsh
        run: |
          if (-not (Test-Path native/Cargo.lock)) {
            throw 'native/Cargo.lock must be generated, reviewed, and committed before a release tag.'
          }

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $cargo = (Select-String -Path native/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if ($cargo -ne $version) {
            throw "Cargo.toml version $cargo does not match package.json version $version"
          }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Validate native runtime
        shell: pwsh
        run: |
          cargo fmt --manifest-path native/Cargo.toml -- --check
          cargo test --manifest-path native/Cargo.toml --locked
          cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings

      - name: Source audit
        run: npm run verify:source

      - name: Build native runtime (locked)
        shell: pwsh
        run: |
          cargo build --manifest-path native/Cargo.toml --release --locked
          node scripts/stage-native.js

      - name: Verify release package
        run: npm run verify

      - name: Create npm tarball
        shell: pwsh
        run: npm pack

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $tgz = Get-ChildItem *.tgz | Select-Object -First 1
          (Get-FileHash $tgz.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $tgz.Name |
            Set-Content "$($tgz.Name).sha256" -Encoding ascii

      - name: Publish GitHub Release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(Get-ChildItem *.tgz, *.tgz.sha256 | ForEach-Object { $_.FullName })
          # Prefer an existing Release (created by gh with curated notes); otherwise create one.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title $tag --generate-notes
          }

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:NODE_AUTH_TOKEN) {
            throw 'Missing repository secret NPM_TOKEN. Add an npm Automation token under Settings → Secrets → Actions.'
          }
          npm publish --access public

      - uses: actions/upload-artifact@v4
        with:
          name: gifshot-win-npm
          path: |
            *.tgz
            *.tgz.sha256
          if-no-files-found: error
